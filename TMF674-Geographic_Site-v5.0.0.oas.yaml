openapi: 3.0.1
info:
  title: Geographic Site
  description: >
    The TMF674 Geographic Site API represents a _managed_ location, such as a retail store,
    warehouse or data centre.

    It will have associations with a collection of `relatedParty`s that are in roles of
    responsibility for the Site.

    A large site might be described in terms of multiple relevant addresses and/or locations, both
    distinguished by

    `role` (such as a `delivery-address`, or `office-entrance`).


    A Geographic Site can manage various unstructured site features, ranging from survey data to
    safety guidelines and

    hazard information.


    ### Resources


    - GeographicSite

    - Hub


    ### Operations


    Geographic Site API performs the following operations:


    - Retrieve a geographic site or a collection of geographic sites

    - Create a new site

    - Update a geographic site

    - Delete a geographic site

    - Notify events on geographic site
